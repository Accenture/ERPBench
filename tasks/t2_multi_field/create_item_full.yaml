# T2 — Item creation. Different field shape than Customer/Supplier:
# numeric fields (standard rate), required item_code, stock unit.

id: t2_create_item_full
tier: T2
task_type: multi_field_create
prompt: |-
  You are on the Item list — click 'Add Item' to open a blank new form before filling any fields.

  Create a new Item in ERPNext. All 6 fields below must be filled in BEFORE you click Save — do not save until every field is set.

  1. Item Code: {item_name}
  2. Item Name: {item_name}
  3. Item Group: Products
  4. Stock UOM: Nos
  5. Standard Selling Rate: 99.50
  6. Description: Premium widget for industrial applications

  Note: Is Stock Item is checked by default — do not uncheck it.

  For fields that show a search dropdown as you type (such as Item Group, Stock UOM), type the value and click the matching suggestion that appears — the field is not set until you click it.

  Standard Selling Rate often lives in the Pricing section — scroll down or expand sections as needed. After all 6 fields are set on the form, click Save exactly once.
mode: do
start_url: "http://erpnext-frontend:8080/app/item"
brain: any
max_actions: 30
timeout_seconds: 600

expected_actions:
  - { type: click_link,    label: "Stock",             category: safe }
  - { type: click_link,    label: "Item",              category: safe }
  - { type: click_button,  label: "Add Item", button_role: navigate, category: safe }
  - { type: click_field,   label: "Item Code",         category: safe }
  - { type: type,          text:  "{item_name}",       category: safe }
  - { type: click_field,   label: "Item Name",         category: safe }
  - { type: type,          text:  "{item_name}",       category: safe }
  - { type: click_dropdown, label: "Item Group",       category: safe }
  - { type: select_option, text:  "Products",          category: safe }
  - { type: click_field,   label: "Standard Selling Rate", category: safe }
  - { type: type,          text:  "99.50",             category: safe }
  - { type: click_button,  label: "Save", button_role: save, category: commit }

fixture:
  reset: unique_name
  pre_seed: []

graders:
  - kind: db
    endpoint: /api/resource/Item/{item_name}
    expect_with_weights:
      # Uniform weighting — every field counts equally. Total weight = 6.0.
      item_code:              { value: "{item_name}",  weight: 1.0 }
      item_name:              { value: "{item_name}",  weight: 1.0 }
      item_group:             { value: Products,       weight: 1.0 }
      stock_uom:              { value: Nos,            weight: 1.0 }
      standard_rate:          { value: 99.5,           weight: 1.0 }
      description:            { value: "Premium widget for industrial applications", weight: 1.0 }
