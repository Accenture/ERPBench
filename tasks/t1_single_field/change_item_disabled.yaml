# T1 — checkbox on a different doctype. Item.disabled is a Check (0/1) field.
# Cross-doctype check on the checkbox pattern. Starts on the Item list
# (/app/item) like the Customer/Lead tasks so all T1 single-field tasks share
# the same starting point (no module-sidebar-navigation difficulty confound).

id: t1_change_item_disabled
tier: T1
task_type: other_edit
prompt: >-
  Open the Item with code '{item_name}' and disable it by checking the
  'Disabled' field. Save the record.
mode: do
start_url: "http://erpnext-frontend:8080/app/item"
brain: any
max_actions: 12
timeout_seconds: 300

expected_actions:
  - { type: click_link,    label: "{item_name}",          category: safe }
  - { type: click_field,   label: "Disabled",             category: safe }
  - { type: click_button,  label: "Save", button_role: save, category: commit }

fixture:
  reset: unique_name
  pre_seed:
    - doctype: Item
      fields:
        item_code: "{item_name}"
        item_name: "{item_name}"
        item_group: Products
        stock_uom: Nos

graders:
  - kind: db
    endpoint: /api/resource/Item/{item_name}
    expect:
      disabled: 1
