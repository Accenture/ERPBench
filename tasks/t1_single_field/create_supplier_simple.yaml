# T1 — CREATE NEW RECORD (Supplier). Tests Buying module navigation.
# Required fields: supplier_name, supplier_group. nav-assist lands on
# Supplier list so the "+ Add Supplier" button is immediately visible.

id: t1_create_supplier_simple
tier: T1
task_type: create
prompt: >-
  Create a new supplier with the name '{supplier_name}', supplier type
  'Company', and supplier group 'All Supplier Groups'. Click Save to commit
  the record.
mode: do
start_url: "http://erpnext-frontend:8080/app/supplier"
brain: any
max_actions: 25
timeout_seconds: 300

expected_actions:
  - { type: click_button, label: "+ Add Supplier",    category: safe }
  - { type: click_field,  label: "Supplier Name",     category: safe }
  - { type: type,         text:  "{supplier_name}",   category: safe }
  - { type: click_button, label: "Save", button_role: save, category: commit }

fixture:
  reset: unique_name

graders:
  - kind: db
    endpoint: /api/resource/Supplier/{supplier_name}
    expect:
      supplier_name: "{supplier_name}"
      supplier_type: "Company"
