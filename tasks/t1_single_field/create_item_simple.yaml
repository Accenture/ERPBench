# T1 — CREATE NEW RECORD (Item). Stock module navigation; fourth doctype.
# Item uses item_code as its name (no auto-naming), so grader can do a
# direct GET. Required fields: item_code, item_group, stock_uom.
# "Products" and "Nos" are default ERPNext setup values.

id: t1_create_item_simple
tier: T1
task_type: create
prompt: >-
  Create a new item with item code '{item_name}', item group 'Products',
  and stock UOM 'Nos'. Click Save to commit the record.
mode: do
start_url: "http://erpnext-frontend:8080/app/item"
brain: any
max_actions: 25
timeout_seconds: 300

expected_actions:
  - { type: click_button, label: "+ Add Item",    category: safe }
  - { type: click_field,  label: "Item Code",     category: safe }
  - { type: type,         text:  "{item_name}",   category: safe }
  - { type: click_button, label: "Save", button_role: save, category: commit }

fixture:
  reset: unique_name

graders:
  - kind: db
    endpoint: /api/resource/Item/{item_name}
    expect:
      item_code: "{item_name}"
      item_group: "Products"
