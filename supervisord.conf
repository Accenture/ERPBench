[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:xvfb]
command=/usr/bin/Xvfb :1 -screen 0 1280x720x24 -ac +extension RANDR
priority=100
autorestart=true
startretries=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:x11vnc]
command=/bin/bash -c "/usr/local/bin/wait-for-display.sh && exec /usr/bin/x11vnc -display :1 -nopw -forever -shared -rfbport 5901 -xkb -quiet"
priority=300
autorestart=true
startretries=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:novnc]
command=/usr/bin/websockify --web=/usr/share/novnc/ 0.0.0.0:3000 localhost:5901
priority=400
autorestart=true
startretries=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:formserver]
command=/usr/bin/python3 -m http.server 8888 --directory /app/observer
priority=500
autorestart=true
startretries=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:chromium]
command=/bin/bash -c "/usr/local/bin/wait-for-display.sh && exec /usr/lib/chromium/chromium --no-sandbox --in-process-gpu --use-gl=swiftshader --disable-crashpad --test-type --disable-infobars --disable-dev-shm-usage --disable-gpu --disable-translate --disable-features=TranslateUI --user-data-dir=/tmp/chromium-profile --window-position=0,0 --window-size=1280,720 --remote-debugging-port=9222 --remote-allow-origins=* --app=\"${TARGET_URL:-http://erpnext-frontend:8080}\""
environment=DISPLAY=":1",HOME="/root",TARGET_URL="%(ENV_TARGET_URL)s"
priority=600
autorestart=true
startretries=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:observer]
command=/bin/bash -c "/usr/local/bin/wait-for-display.sh && exec /usr/bin/python3 ${OBSERVER_SERVER:-/app/observer/observer_server.py}"
environment=DISPLAY=":1",HOME="/root",PYTHONUNBUFFERED="1"
directory=/app/observer
priority=700
autorestart=true
startretries=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:observer_brain]
command=/bin/bash -c "/usr/local/bin/wait-for-display.sh && exec /app/observer/start_brain.sh"
environment=DISPLAY=":1",HOME="/root",PYTHONUNBUFFERED="1",BRAIN_PROVIDER="%(ENV_BRAIN_PROVIDER)s",ANTHROPIC_API_KEY="%(ENV_ANTHROPIC_API_KEY)s",CLAUDE_MODEL="%(ENV_CLAUDE_MODEL)s",MAX_INVESTIGATION_ROUNDS="%(ENV_MAX_INVESTIGATION_ROUNDS)s",QWEN_API_KEY="%(ENV_QWEN_API_KEY)s",QWEN_BASE_URL="%(ENV_QWEN_BASE_URL)s",QWEN_MODEL="%(ENV_QWEN_MODEL)s",MAX_TURNS_PER_TASK="%(ENV_MAX_TURNS_PER_TASK)s",UITARS_HOST="%(ENV_UITARS_HOST)s",UITARS_DEBUG="%(ENV_UITARS_DEBUG)s",UITARS_API_KEY="%(ENV_UITARS_API_KEY)s",UITARS_API_BASE_URL="%(ENV_UITARS_API_BASE_URL)s",UITARS_API_MODEL="%(ENV_UITARS_API_MODEL)s",OPENCUA_API_KEY="%(ENV_OPENCUA_API_KEY)s",OPENCUA_BASE_URL="%(ENV_OPENCUA_BASE_URL)s",OPENCUA_MODEL="%(ENV_OPENCUA_MODEL)s"
directory=/app/observer
priority=800
autorestart=true
startretries=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
